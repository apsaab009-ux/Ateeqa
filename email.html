<!DOCTYPE html>
<html>
<head>
  <title>Tailor Contact</title>
  <style>
    body {
      font-family: Arial;
      background: rgb(232, 74, 74);
      text-align: center;
    }

    .container {
      width: 400px;
      margin: 50px auto;
      background: maroon;
      padding: 40px;
      border-radius: 10px;
      color:white;
      box-shadow: 0 0 10px white;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 50px;
      border-color: purple;
    }

    button {
      background: #3189e1;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #e67e22;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Contact Tailor</h2>

  <input type="text" id="name" placeholder="Your Name">
  <input type="email" id="email" placeholder="Your Email">
  <textarea id="message" placeholder="Your Message"></textarea>

  <button onclick="sendMessage()">Send</button>

  <p id="status"></p>
</div>

<script>
function sendMessage() {
  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let message = document.getElementById("message").value;

  if(name === "" || email === "" || message === "") {
    document.getElementById("status").innerText = "Please fill all fields!";
    return;
  }

  document.getElementById("status").innerText = "Message sent successfully!";
}
</script>
<a href="tailor.html">Go to main page</a>
</body>
</html>
