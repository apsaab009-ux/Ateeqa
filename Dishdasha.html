<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kuwait Tailor - Dishdasha</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: rgb(245, 94, 94);
}

header {
  background: maroon;
  color: white;
  padding: 15px;

  text-align: center;
}

nav a {
  color: white;
  margin: 10px;
  text-decoration: none;
}

.hero {
  background: url('dish-bg.jpg') center/cover;
  color: maroon;
  text-align: center;
  padding: 100px 20px;
}

button {
  background: maroon;color: white;
  border: none;
  padding: 10px 20px;
  cursor: pointer;
}

#services {
  padding: 40px;
  text-align: center;
  color:white;
}

.card {
  background: maroon; color:white;
  padding: 20px;
  margin: 10px;
  display: inline-block;
  width: 250px;
  box-shadow: 0 0 10px white;
}

#gallery img {
  width: 30%;
  margin: 10px;
}

form {
  display: flex;
  flex-direction: column;
  width: 300px;
  margin: auto;
}

input, select {
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  border-color: maroon;
}
    footer{background-color:maroon;
    text-align: center;}
    h2{text-align: center;
    color:maroon;}
  </style>
</head>
<body>

<header>
  <h1>Kuwait Tailor</h1>
</header>

<section class="hero">
  <h2>Premium Dishdasha Tailoring</h2>
  <p>Custom-made traditional wear with perfect fit</p>
  <button onclick="scrollToBooking()">Order Now</button>
</section>

<section id="services">
  <h2>Our Services</h2>
  <div class="card">
    <h3>Custom Dishdasha</h3>
    <p>Tailored to your exact measurements</p>
  </div>
  <div class="card">
    <h3>Fabric Selection</h3>
    <p>Choose from premium Kuwaiti fabrics</p>
  </div>
  
</section>

<section id="gallery">
  <h2>Our Work</h2>
  <img src="download.jpg">
  <img src="images (11).jpg">
  <img src="images (16).jpg">
</section>

<section id="booking">
  <h2>Book Your Dishdasha</h2>
  <form id="orderForm">
    <input type="text" placeholder="Your Name" required>
    <input type="tel" placeholder="Phone Number" required>
    <select>
      <option>White Dishdasha</option>
      <option>Winter Dishdasha</option>
    </select>
    <button type="submit">Submit</button>
  </form>
</section>

<footer>
  <p>© 2024 Kuwait Tailor</p>
</footer>
   <a href="tailor.html">Go to main page</a>
<script>
    function scrollToBooking() {
  document.getElementById("booking").scrollIntoView({
    behavior: "smooth"
  });
}

document.getElementById("orderForm").addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Your order has been submitted!");
});
</script>
</body>
</html>
